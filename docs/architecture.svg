<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">GShark architecture</title>
  <desc id="desc">A left-to-right view of the Vue console, GShark runtime, scan providers, and shared MySQL persistence rail.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #475569; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .detail { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .provider { font: 600 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3b2a5f; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .edge-label { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="760" rx="18"/>
  <text class="title" x="60" y="58">GShark architecture</text>
  <text class="subtitle" x="60" y="88">The management console and scan plane share one persistent state store.</text>

  <!-- Main left-to-right flow -->
  <rect x="50" y="125" width="270" height="360" rx="16" fill="#f4f8ff" stroke="#8eb1df" stroke-width="2"/>
  <text class="section" x="78" y="165">01 · INTERFACE</text>
  <rect x="80" y="200" width="210" height="160" rx="12" fill="#e8f1ff" stroke="#3b6ea8" stroke-width="2.5"/>
  <text class="label" x="105" y="290">Vue 3 console</text>
  <text class="detail" x="105" y="325">Vite · Router · Vuex</text>
  <text class="detail" x="105" y="352">Element Plus</text>
  <text class="detail" x="105" y="379">rules · results · review</text>

  <rect x="360" y="125" width="360" height="360" rx="16" fill="#f3faf6" stroke="#8bc7a9" stroke-width="2"/>
  <text class="section" x="388" y="165">02 · RUNTIME</text>
  <rect x="390" y="200" width="300" height="160" rx="12" fill="#e8f6ee" stroke="#3d8b68" stroke-width="2.5"/>
  <text class="label" x="420" y="250">gshark serve</text>
  <text class="detail" x="420" y="280">Gin management API · :8888</text>
  <rect x="390" y="385" width="300" height="80" rx="12" fill="#e8f6ee" stroke="#3d8b68" stroke-width="2.5"/>
  <text class="label" x="420" y="420">gshark scan</text>
  <text class="detail" x="420" y="447">15-minute cycle · watchdog</text>

  <rect x="770" y="125" width="780" height="360" rx="16" fill="#fffaf0" stroke="#d8b77a" stroke-width="2"/>
  <text class="section" x="798" y="165">03 · PROVIDER ADAPTERS</text>
  <rect x="800" y="205" width="230" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="873" y="253">GitHub</text>
  <rect x="1050" y="205" width="230" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="1120" y="253">GitLab</text>
  <rect x="1300" y="205" width="220" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="1327" y="253">Sourcegraph</text>
  <rect x="800" y="325" width="230" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="870" y="373">Postman</text>
  <rect x="1050" y="325" width="470" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="1200" y="373">DNS / gobuster</text>

  <!-- Shared persistence rail -->
  <rect x="360" y="560" width="1190" height="130" rx="16" fill="#fff7e8" stroke="#d9a84e" stroke-width="2"/>
  <text class="section" x="390" y="600">04 · SHARED PERSISTENCE</text>
  <text class="label" x="390" y="650">MySQL 8</text>
  <text class="detail" x="545" y="650">configuration · rules · tokens · results · scan logs · assets</text>

  <!-- Clean, non-crossing connectors -->
  <path class="edge" d="M290 280 H390"/>
  <text class="edge-label" x="300" y="265">HTTP /api</text>
  <path class="edge" d="M690 425 H770"/>
  <text class="edge-label" x="695" y="410">search</text>
  <path class="edge-dashed" d="M690 280 H735 V560"/>
  <text class="edge-label" x="744" y="265">management data</text>
  <path class="edge-dashed" d="M600 465 V560"/>
  <text class="edge-label" x="615" y="520">rules · logs</text>
  <path class="edge" d="M1160 405 V560"/>
  <text class="edge-label" x="1175" y="520">findings</text>

  <line x1="60" y1="720" x2="1540" y2="720" stroke="#e2e8f0" stroke-width="2"/>
  <text class="subtitle" x="60" y="748">Providers run inside the scan plane; every finding and scan status is persisted on the shared rail.</text>
</svg>
