<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="680" viewBox="0 0 1600 680" role="img" aria-labelledby="title desc">
  <title id="title">GShark architecture</title>
  <desc id="desc">A left-to-right view of the Vue console, GShark runtime, scan providers, and shared MySQL storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      .canvas { fill: #ffffff; }
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .subtitle { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .section { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: 1.5px; fill: #475569; }
      .label { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .detail { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .provider { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #3b2a5f; }
      .edge { fill: none; stroke: #64748b; stroke-width: 2.5; marker-end: url(#arrow); }
      .edge-dashed { fill: none; stroke: #94a3b8; stroke-width: 2; stroke-dasharray: 8 7; marker-end: url(#arrow); }
      .edge-label { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect class="canvas" width="1600" height="680" rx="18"/>
  <text class="title" x="60" y="58">GShark architecture</text>
  <text class="subtitle" x="60" y="88">Management and scanning share one MySQL state store; providers run inside the scan plane.</text>

  <rect x="50" y="125" width="270" height="460" rx="16" fill="#f4f8ff" stroke="#8eb1df" stroke-width="2"/>
  <text class="section" x="78" y="165">01 · INTERFACE</text>
  <rect x="80" y="240" width="210" height="160" rx="12" fill="#e8f1ff" stroke="#3b6ea8" stroke-width="2.5"/>
  <text class="label" x="105" y="290">Vue 3 console</text>
  <text class="detail" x="105" y="325">Vite · Router · Vuex</text>
  <text class="detail" x="105" y="352">Element Plus</text>
  <text class="detail" x="105" y="379">rules · results · review</text>

  <rect x="360" y="125" width="360" height="460" rx="16" fill="#f3faf6" stroke="#8bc7a9" stroke-width="2"/>
  <text class="section" x="388" y="165">02 · RUNTIME</text>
  <rect x="390" y="205" width="300" height="125" rx="12" fill="#e8f6ee" stroke="#3d8b68" stroke-width="2.5"/>
  <text class="label" x="420" y="255">gshark serve</text>
  <text class="detail" x="420" y="287">Gin management API · :8888</text>
  <rect x="390" y="390" width="300" height="145" rx="12" fill="#e8f6ee" stroke="#3d8b68" stroke-width="2.5"/>
  <text class="label" x="420" y="440">gshark scan</text>
  <text class="detail" x="420" y="472">15-minute cycle</text>
  <text class="detail" x="420" y="498">30-minute provider watchdog</text>

  <rect x="770" y="125" width="430" height="460" rx="16" fill="#fffaf0" stroke="#d8b77a" stroke-width="2"/>
  <text class="section" x="798" y="165">03 · PROVIDER ADAPTERS</text>
  <rect x="800" y="205" width="175" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="843" y="253">GitHub</text>
  <rect x="995" y="205" width="175" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="1040" y="253">GitLab</text>
  <rect x="800" y="325" width="175" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="817" y="373">Sourcegraph</text>
  <rect x="995" y="325" width="175" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="1035" y="373">Postman</text>
  <rect x="800" y="445" width="370" height="80" rx="10" fill="#f4efff" stroke="#9277c2" stroke-width="2"/>
  <text class="provider" x="918" y="493">DNS / gobuster</text>

  <rect x="1250" y="125" width="300" height="460" rx="16" fill="#fff7e8" stroke="#d9a84e" stroke-width="2"/>
  <text class="section" x="1278" y="165">04 · PERSISTENCE</text>
  <rect x="1280" y="245" width="240" height="190" rx="12" fill="#fff0d2" stroke="#b8791d" stroke-width="2.5"/>
  <text class="label" x="1325" y="300">MySQL 8</text>
  <text class="detail" x="1310" y="340">configuration</text>
  <text class="detail" x="1310" y="370">results and rules</text>
  <text class="detail" x="1310" y="400">scan logs and assets</text>

  <path class="edge" d="M290 320 H390 V267"/>
  <text class="edge-label" x="300" y="306">HTTP /api</text>
  <path class="edge" d="M690 462 H770"/>
  <text class="edge-label" x="694" y="447">search</text>
  <path class="edge" d="M1200 365 H1280"/>
  <text class="edge-label" x="1197" y="348">findings</text>
  <path class="edge-dashed" d="M690 267 H735 V185 H1240 V290 H1280"/>
  <text class="edge-label" x="800" y="179">management data</text>
  <path class="edge-dashed" d="M690 465 H735 V570 H1240 V420 H1280"/>
  <text class="edge-label" x="806" y="562">rules · tokens · scan status</text>

  <line x1="60" y1="620" x2="1540" y2="620" stroke="#e2e8f0" stroke-width="2"/>
  <text class="subtitle" x="60" y="650">The scan plane runs providers sequentially and persists their findings and status in the shared database.</text>
</svg>
