# Development only: use with -f docker-compose.yaml -f docker-compose.build.yaml.
services:
  server:
    image: gshark-backend:local
    build:
      context: ./server
    pull_policy: never
  scan:
    image: gshark-backend:local
    pull_policy: never
  web:
    image: gshark-web:local
    build:
      context: ./web
    pull_policy: never
