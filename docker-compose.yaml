x-backend: &backend
  image: ghcr.io/madneal/gshark:${GSHARK_VERSION:?Set GSHARK_VERSION in .env}
  restart: always
  environment:
    GSHARK_CONFIG: config.docker.yaml
    GSHARK_MYSQL_PATH: mysql:3306
    GSHARK_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    GSHARK_JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
  volumes:
    - ./server/config.docker.yaml:/go/src/github.com/madneal/gshark/server/config.docker.yaml
  depends_on:
    mysql:
      condition: service_healthy

services:
  mysql:
    # Keep the existing database image/data format during application upgrades.
    image: ${MYSQL_IMAGE:-mysql/mysql-server:8.0.21}
    container_name: gshark-mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  web:
    image: ghcr.io/madneal/gshark-web:${GSHARK_VERSION:?Set GSHARK_VERSION in .env}
    container_name: gshark-web
    restart: always
    ports:
      - '${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080'
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  server:
    <<: *backend
    container_name: gshark-server
    command: ["serve"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8888/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

  scan:
    <<: *backend
    container_name: gshark-scanner
    command: ["scan"]
    profiles: ["scan"]
    environment:
      GSHARK_CONFIG: config.docker.yaml
      GSHARK_MYSQL_PATH: mysql:3306
      GSHARK_MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      GSHARK_JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      GOMEMLIMIT: 384MiB
      GOGC: "75"
      GOMAXPROCS: "1"
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    pids_limit: 128
