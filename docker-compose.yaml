services:
  mysql:
    image: mysql/mysql-server:8.0.21
    container_name: gshark-mysql
    command: mysqld --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    restart: always
    environment:
      MYSQL_ROOT_HOST: "%"
      MYSQL_ROOT_PASSWORD: madneal
    volumes:
      - ./mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 2s
      retries: 10

  web:
    # Requires a release with published GHCR images; older ZIP-only releases do not work.
    image: ghcr.io/madneal/gshark-web:v2.1.27
    build: ./web
    container_name: gshark-web
    restart: always
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      - server

  server:
    image: ghcr.io/madneal/gshark:v2.1.27
    build: ./server
    container_name: gshark-server
    command: ["serve"]
    environment:
      GSHARK_CONFIG: config.docker.yaml
    volumes:
      - ./server/config.docker.yaml:/go/src/github.com/madneal/gshark/server/config.docker.yaml
    restart: always
    depends_on:
      mysql:
        condition: service_healthy

  scan:
    image: ghcr.io/madneal/gshark:v2.1.27
    container_name: gshark-scanner
    command: ["scan"]
    profiles: ["scan"]
    environment:
      GSHARK_CONFIG: config.docker.yaml
      GOMEMLIMIT: 384MiB
      GOGC: "75"
      GOMAXPROCS: "1"
    mem_limit: 512m
    mem_reservation: 256m
    cpus: "1.0"
    pids_limit: 128
    volumes:
      - ./server/config.docker.yaml:/go/src/github.com/madneal/gshark/server/config.docker.yaml
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
